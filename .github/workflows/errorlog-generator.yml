name: Error Log Generator

on:
  push:
    branches:
      - main
      - patch-*
    paths:
      - 'scripts/errorlog-generator/**'
      - '.github/workflows/errorlog-generator.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'scripts/errorlog-generator/**'

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  generate-error-logs:
    name: Generate Error Logs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/errorlog-generator/requirements.txt

      - name: Validate project structure
        run: |
          test -f scripts/errorlog-generator/errorlog_generator.py
          test -f scripts/errorlog-generator/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: scripts/errorlog-generator
        run: pip install -r requirements.txt

      - name: Validate dependencies
        run: pip check

      - name: Install linting tools
        run: pip install ruff

      - name: Lint source code
        working-directory: scripts/errorlog-generator
        run: ruff check .

      - name: Validate Python syntax
        working-directory: scripts/errorlog-generator
        run: python -m py_compile errorlog_generator.py

      - name: Run error log generator
        working-directory: scripts/errorlog-generator
        run: python errorlog_generator.py

      - name: Validate output directory
        run: |
          test -d scripts/errorlog-generator/logs

      - name: Validate generated log files
        run: |
          find scripts/errorlog-generator/logs -type f | head -1

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: scripts/errorlog-generator/logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: echo "❌ Error log generation failed"

      - name: Notify on success
        if: success()
        run: echo "✅ Error logs generated successfully"
